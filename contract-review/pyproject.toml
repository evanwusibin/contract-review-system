[project]
name = "contract-review"
version = "0.2.0"
description = "Contract review vertical slices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "minio>=7.2,<8",
    "pymupdf>=1.27,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "aiofiles>=24.1,<25",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
